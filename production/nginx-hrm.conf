# HRM Nginx config template (Option B, server parity without Laragon).
# COPIED VERBATIM from the proven production C:\nginx\conf\nginx.conf,
# except three TOKENS (marked like %%PUBLIC_ROOT%% in the file body below),
# which Install-HRM-OneClick.ps1 fills in:
#   PUBLIC_ROOT    forward-slash path to the Laravel public dir (D:/hrm/public)
#   LAN_IP         machine LAN IPv4 for server_name (10.10.250.2)
#   STORAGE_PUBLIC forward-slash path to storage/app/public (D:/hrm/storage/app/public)
# Upstream contract (DO NOT CHANGE without the supervisor pool):
#   php-cgi workers listen on 127.0.0.1:9000-9003 (see scripts/Start-HRM-Windows.ps1).
# ASCII-only by project rule.
worker_processes  auto;
error_log  logs/error.log warn;
pid        logs/nginx.pid;

events {
    worker_connections  2048;
    use select;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 50M;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;

    access_log  logs/access.log;

    # PHP-CGI Pool - Load Balancing
    upstream php_cgi_pool {
        least_conn;
        server 127.0.0.1:9000;
        server 127.0.0.1:9001;
        server 127.0.0.1:9002;
        server 127.0.0.1:9003;

        keepalive 16;
    }

    server {
        listen       80;
        server_name  localhost %%LAN_IP%%;

        root         %%PUBLIC_ROOT%%;
        index        index.php index.html;

        charset utf-8;

        # Handle static assets via Vite build
        location /build/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location /storage/ {
            alias %%STORAGE_PUBLIC%%/;
            try_files $uri =404;
            expires 1M;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass   php_cgi_pool;
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
            include        fastcgi_params;
            fastcgi_buffer_size 128k;
            fastcgi_buffers 4 256k;
            fastcgi_busy_buffers_size 256k;
            fastcgi_read_timeout 300;
            fastcgi_connect_timeout 5;
            fastcgi_send_timeout 300;
        }

        location ~ /\.ht {
            deny  all;
        }

        location ~ /\.env {
            deny all;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
